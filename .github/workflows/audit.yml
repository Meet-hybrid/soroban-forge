name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    # audit-check publishes its result as a check run on the commit.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-low: true
          deny-warnings: false
          # RUSTSEC-2026-0387 (transitive crypto-bigint 0.5.5, no patched
          # 0.5.x) is ignored until soroban-sdk moves to elliptic-curve 0.14;
          # see .cargo/audit.toml. Warnings (e.g. transitive `paste`
          # unmaintained) do not fail this job while `deny-warnings` is false.
          ignore: RUSTSEC-2026-0387
