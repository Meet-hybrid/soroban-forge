# Repository settings are tracked here as documentation and can be applied with
# the GitHub Settings/Probot Settings app by a repository administrator.
repository:
  name: soroban-forge
  topics:
    - soroban
    - stellar
    - rust
    - smart-contracts
    - developer-tools
    - github-actions

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - Rustfmt
          - Clippy
          - Build
          - Test
          - Security Audit
          - WASM Size Check
      # Admins are exempt so owner-authored pull requests are not blocked on
      # a second approver (GitHub forbids self-approval). Contributors still
      # need one approving review.
      enforce_admins: false
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        required_approving_review_count: 1
      restrictions: null
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      required_conversation_resolution: true
