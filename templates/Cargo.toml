[package]
name = "soroban-forge-<CONTRACT_NAME>"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Soroban Forge contract: <CONTRACT_NAME>"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk.workspace = true
soroban-forge-shared-utils = { path = "../shared-utils", version = "0.1.0" }

[dev-dependencies]
soroban-sdk.workspace = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
