# Dependency policy configuration for Soroban Forge.
# This file enforces license compatibility, source restrictions, and duplicate detection.
#
# Reference: https://embarkstudios.github.io/cargo-deny/
# Run checks locally:
#   cargo deny check licenses
#   cargo deny check sources
#   cargo deny check bans
#
# For exceptions, add a comment explaining why the exception is justified.

[advisories]
# Advisory checking is delegated to the existing `cargo audit` job in CI.
# To avoid duplicate tooling noise, advisories are not checked by cargo-deny.
# See .github/workflows/ci.yml for the audit configuration.
# Uncomment the vulnerability-check option below to enable advisory checks here.
# vulnerability = "deny"
# unmaintained = "deny"
# yanked = "deny"
# notice = "deny"
# ignore = []

[licenses]
# Workspace licensed as MIT OR Apache-2.0.
# Allow only compatible, permissive licenses commonly used in the Rust ecosystem.
# Deny all other licenses by default.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 OR MIT",
    "MIT OR Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
# Deprecated: use of copyleft licenses is not permitted.
# GPL/AGPL/SSPL would require all of Soroban Forge to be released under the same license.
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "SSPL-1.0",
]
# Crates that don't declare a license explicitly.
# We allow these with scrutiny: each such crate is reviewed and exceptions are documented below.
copyleft = "allow"
# Allow dual-licensing scenarios (e.g. licensed under both MIT and Apache-2.0).
allow-dual-licenses = true
# CI fails if confidence is not high enough.
confidence-threshold = 0.8

# Exceptions for crates without declared licenses or with ambiguous license info.
# Each exception includes a comment explaining why it is justified.
# Common patterns: unmaintained crates, workspace members, or permissively-intended but undeclared.
exceptions = [
    # Workspace members do not need explicit license declarations.
    # { name = "soroban-forge-*", allow = ["MIT OR Apache-2.0"] },
]

[sources]
# Only allow dependencies from crates.io. No git, path, or alternative registry sources.
# This prevents supply-chain surprises and ensures reproducible builds.
allow-org = {}
allow-registry = ["crates-io"]
allow-git = []

# Exceptions for git/path sources can be documented here if unavoidable.
# Format: { name = "crate-name", allow = ["https://github.com/owner/repo"] }
exceptions = [
    # None at this time. All dependencies come from crates.io.
]

[bans]
# Duplicate detection and version alignment.
# Multiple versions of the same crate are flagged; justifications are documented below.
# Policy: prefer single versions; multiple versions are allowed only with documented rationale.
multiple-versions = "warn"
# Highlightdirectly-used but unused crates.
unused-default-features = "warn"
# Highlight crates that skip default features unnecessarily.
default-features = "warn"
# Allow multiple versions only with explicit exception.
allow = [
    # No duplicates allowed without documentation.
]
# Deny certain crates from being included at all.
deny = [
    # No globally banned crates at this time.
]
# Check for crates with unmaintained status or very old MSRV.
skip-tree = []

[sources.unknown-registry]
# Default policy: unknown registries are denied.
deny = []

[sources.unknown-git]
# Default policy: unknown git repositories are denied.
deny = []
