[package]
name = "soroban-forge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Developer CLI for Soroban Forge"

[[bin]]
name = "soroban-forge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.12"
handlebars = "6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
stellar-strkey = "1.0.0"
rand = "0.8"
ed25519-dalek = "2"
stellar-xdr = { version = "21.2.0", features = ["base64", "curr"] }
soroban-spec = "29.0.1"
stellar-xdr-28 = { package = "stellar-xdr", version = "28.0.0", features = ["base64"] }

tracing-subscriber = "0.3"
tempfile = "3.8"
