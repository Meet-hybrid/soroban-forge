# Pin the compiler used to build the checked-in WASM and generated SDK
# artifacts. A moving `stable` channel makes ABI output change underneath
# `verify:generated` as Rust and LLVM evolve.
[toolchain]
channel  = "1.96.0"
components = ["rustfmt", "clippy"]
profile  = "minimal"
targets  = ["wasm32v1-none"]

[toolchain.rust-analyzer]
rustfmt.overrideCommand = ["cargo", "fmt", "--"]
